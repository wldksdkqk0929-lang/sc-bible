<!DOCTYPE html>
<html lang="ko">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T5N2GXF8TF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T5N2GXF8TF');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인맞음 암기 시스템 (V26.0 Modular Audio)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
    
    <!-- [모듈화 1] 디자인 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="mode-memorize">
    <div class="watermark"></div>
    <div id="modeToast"></div>
    
    <header>
        <div class="deck-options">
            <div class="brand-logo">하루 한걸음</div>
            <div class="opt-group">
                <button id="btnDistrictMode" class="icon-btn" onclick="openDistrictLogin()" title="구역장 모드">👨‍🎓</button>
                <button class="icon-btn" onclick="openManual()" title="사용법">📖</button>
                <button id="editModeBtn" class="icon-btn" onclick="toggleEditMode()" title="마킹">✏️</button>
                <button class="icon-btn" onclick="openSearch()" title="검색">🔍</button>
                <button class="icon-btn" onclick="toggleTheme()" title="테마">🌙</button>
                <button id="testModeBtn" class="icon-btn" onclick="toggleTestMode()" title="시험">📝</button>
            </div>
        </div>
        <div class="deck-chapters" id="chNav"></div>
        <div class="deck-subs" id="subNav"></div>
    </header>

    <main id="content"></main>

    <div class="dock-container">
        <div class="nav-dock">
            <button class="arrow-btn" onclick="moveSection(-1)">❮</button>
            <button id="masterBtn" class="dock-center-btn" onclick="toggleChapter()">
                <span class="pc-text">👁️ 전체보기</span>
                <span class="mobile-text">👁️ 전체보기</span>
            </button>
            <button id="saveMarkBtn" class="dock-center-btn" onclick="saveMark()">🖍️ 선택 저장</button>
            <button class="arrow-btn" onclick="moveSection(1)">❯</button>
        </div>
    </div>

    <!-- Modals & Overlays -->
    <div id="searchModal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="margin:0;">검색</h2><button onclick="closeSearch()" style="background:none; border:none; font-size:24px; cursor:pointer;">✕</button>
        </div>
        <div style="display:flex; gap:10px; max-width:600px; margin:0 auto; width:100%;">
            <input type="text" id="searchInput" class="search-input" placeholder="검색어 입력" onkeypress="if(event.key==='Enter') doSearch()">
            <button onclick="doSearch()" style="background:var(--primary-gradient); color:#fff; border:none; padding:0 25px; border-radius:12px; font-weight:700;">검색</button>
        </div>
        <div id="searchStatusBox" style="text-align:center; margin:15px; display:none;"><span id="searchCount"></span></div>
        <div id="searchResults" style="flex:1; overflow-y:auto; padding-bottom:50px;"></div>
    </div>

    <div id="security-gate">
        <div class="gate-card">
            <div style="font-size:36px; margin-bottom:10px;">🔐</div>
            <h2 class="gate-title">인맞음 암기 시스템</h2>
            <p style="color:#58636d; font-size:14px; margin-bottom:25px; font-weight:500;">보안 코드를 입력하고 입장하세요.</p>
            <input type="tel" id="gate-code" class="gate-input" placeholder="CODE" maxlength="4" autocomplete="off">
            <button class="gate-btn" onclick="unlockGate()">입장하기</button>
        </div>
    </div>

    <div id="districtModal">
        <div class="dm-overlay" onclick="closeDistrictLogin()"></div>
        <div class="dm-card">
            <h2 style="margin:0 0 15px 0; color:#2d3436;">👨‍🎓 구역장 모드 진입</h2>
            <select id="dmGroup" class="dm-input">
                <option value="장년회">장년회</option><option value="부녀회">부녀회</option><option value="청년회">청년회</option>
                <option value="자문회">자문회</option><option value="학생회">학생회</option><option value="지역">지역</option><option value="24부서">24부서</option>
            </select>
            <input type="tel" id="dmPass" class="dm-input" placeholder="비밀번호 입력" maxlength="4">
            <button class="dm-btn" onclick="checkDistrictLogin()">확인</button>
            <button class="dm-close" style="background:transparent; border:none; font-weight:bold; cursor:pointer;" onclick="closeDistrictLogin()">취소</button>
        </div>
    </div>

    <!-- [모듈화 2] 구동 엔진 연결 -->
    <script src="engine.js"></script>

    <!-- [모듈화 3] 7,000줄 성경 데이터 연결 -->
    <script src="bible_data.js"></script>

</body>
</html>
