<!DOCTYPE html>
<html lang="ko">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T5N2GXF8TF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T5N2GXF8TF');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인맞음 암기 시스템 (V26.0 + Audio)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>

    <link rel="stylesheet" href="styles.css">
    <script src="data.js"></script>
    <script defer src="engine.js"></script>
</head>
<body class="mode-memorize">
    <div class="watermark"></div>
    <div id="modeToast"></div>
    
    <header>
        <div class="deck-options">
            <div class="brand-logo">하루 한걸음</div>
            <div class="opt-group">
                <button class="icon-btn" onclick="openManual()" title="사용법">📖</button>
                <button id="editModeBtn" class="icon-btn" onclick="toggleEditMode()" title="마킹">✏️</button>
                <button class="icon-btn" onclick="openSearch()" title="검색">🔍</button>
                <button class="icon-btn" onclick="toggleTheme()" title="테마">🌙</button>
                <button id="testModeBtn" class="icon-btn" onclick="toggleTestMode()" title="시험">📝</button>
            </div>
        </div>
        <div class="deck-chapters" id="chNav"></div>
        <div class="deck-subs" id="subNav"></div>
    </header>

    <main id="content"></main>

    <div class="dock-container">
        
        <div id="audio-popup-panel" style="z-index: 3000;">
            <div style="display:flex; gap:5px; align-items:center;">
                <button class="spd-btn" onclick="setAudioSpeed(0.8, this)">0.8x</button>
                <button class="spd-btn active" onclick="setAudioSpeed(1.0, this)">1.0x</button>
                <button class="spd-btn" onclick="setAudioSpeed(1.2, this)">1.2x</button>
            </div>
            <div style="width:1px; height:20px; background:var(--glass-border);"></div>
            <div style="display:flex; gap:8px; align-items:center;">
                <span style="font-size:12px; font-weight:bold; color:var(--text-sub);">반복</span>
                <input type="number" id="loopCount" class="loop-input" value="1" min="1" max="99">
            </div>
        </div>

        <div class="nav-dock">
            <button class="arrow-btn" onclick="moveSection(-1)">❮</button>
            
            <div class="dock-center-group">
                <button id="masterBtn" class="dock-center-btn" onclick="toggleChapter()">
                    <span class="pc-text">👁️ 1장 전체보기</span>
                    <span class="mobile-text">👁️ 전체보기</span>
                </button>
                <button id="saveMarkBtn" class="dock-center-btn" onclick="saveMark()">🖍️ 선택 저장</button>
                <button class="dock-audio-btn" id="audioToggleBtn" onclick="toggleAudioPanel()">🎵</button>
            </div>

            <button class="arrow-btn" onclick="moveSection(1)">❯</button>
        </div>
    </div>

    <div id="searchModal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="margin:0;">검색</h2>
            <button onclick="closeSearch()" style="background:none; border:none; font-size:24px; color:var(--text-main); cursor:pointer;">✕</button>
        </div>
        <div style="display:flex; gap:10px; max-width:600px; margin:0 auto; width:100%;">
            <input type="text" id="searchInput" class="search-input" placeholder="검색어 입력" onkeypress="if(event.key==='Enter') doSearch()">
            <button onclick="doSearch()" style="background:var(--primary-gradient); color:#fff; border:none; padding:0 25px; border-radius:12px; font-weight:700; cursor:pointer;">검색</button>
        </div>
        <div id="searchStatusBox" style="text-align:center; margin:15px; display:none;">
            <span id="searchCount"></span>
        </div>
        <div id="searchResults" style="flex:1; overflow-y:auto; padding-bottom:50px;"></div>
    </div>

    <div id="security-gate">
        <div class="gate-card">
            <div style="font-size:36px; margin-bottom:10px;">🔐</div>
            <h2 class="gate-title">인맞음 암기 시스템</h2>
            <p class="gate-desc">보안 코드를 입력하고 입장하세요.</p>
            <div class="gate-input-wrap">
                <input type="tel" id="gate-code" class="gate-input" placeholder="CODE" maxlength="4" autocomplete="off">
            </div>
            <button class="gate-btn" onclick="unlockGate()">입장하기</button>
            <button class="gate-manual-btn" onclick="openManual()">📖 사용법 보기</button>
        </div>
    </div>

    <div id="manualOverlay">
        <div class="manual-box">
            <div class="m-header">
                <span class="m-step-badge" id="mStepBadge">Step 1 / 8</span>
                <button class="m-close-btn" onclick="closeManual()">✕</button>
            </div>
            <div class="m-visual-zone" id="mVisualZone"></div>
            <div class="m-text-zone">
                <div class="m-title" id="mTitle">제목</div>
                <div class="m-desc" id="mDesc">설명 내용</div>
            </div>
            <div class="m-footer">
                <button class="m-nav-btn btn-prev" onclick="prevStep()">이전</button>
                <div class="m-dots" id="mDots"></div>
                <button class="m-nav-btn btn-next" id="btnNext" onclick="nextStep()">다음</button>
                <button class="m-nav-btn btn-start" id="btnStart" onclick="closeManual()">시작하기</button>
            </div>
        </div>
    </div>

    <div id="districtModal" style="display:none;">
        <div class="dm-overlay" onclick="closeDistrictLogin()"></div>
        <div class="dm-card">
            <h2 style="margin:0 0 15px 0; color:#2d3436;">👨‍🎓 구역장 모드 진입</h2>
            <select id="dmGroup" class="dm-input">
                <option value="장년회">장년회</option>
                <option value="부녀회">부녀회</option>
                <option value="청년회">청년회</option>
                <option value="자문회">자문회</option>
                <option value="학생회">학생회</option>
                <option value="지역">지역</option>
                <option value="24부서">24부서</option>
            </select>
            <input type="tel" id="dmPass" class="dm-input" placeholder="비밀번호 입력" maxlength="4">
            <button class="dm-btn" onclick="checkDistrictLogin()">확인</button>
            <button class="dm-close" onclick="closeDistrictLogin()">취소</button>
        </div>
    </div>

</body>
</html>
