ackground: var(--btn-base); border: 1px solid var(--glass-border);border-radius: 12px; padding: 8px 16px; font-size: 15px; font-weight: 700; color: var(--text-sub);cursor: pointer; transition: 0.3s;}.ch-btn.active { background: var(--primary-gradient); color: var(--btn-active-text); transform: scale(1.05); }.row-subs { padding: 10px 15px; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid var(--glass-border); scrollbar-width: none; }.sub-btn {flex-shrink: 0; background: var(--btn-base); border: 1px solid var(--glass-border);color: var(--text-sub); border-radius: 12px; padding: 6px 16px; font-size: 13px; font-weight: 600;cursor: pointer; transition: 0.2s;}.sub-btn.active-sub { background: var(--primary-gradient); color: var(--btn-active-text); transform: scale(1.05); }main { width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px 15px; box-sizing: border-box; }.section-group {scroll-margin-top: 180px;margin-bottom: 25px; background: var(--glass-card-bg);backdrop-filter: blur(10px); border: 1px solid var(--glass-border);border-radius: 20px; box-shadow: var(--shadow-soft); overflow: hidden;}.sec-header {background: rgba(0,0,0,0.03); border-bottom: 1px solid var(--glass-border);padding: 15px 20px; display: flex; align-items: center;justify-content: space-between;gap: 15px;}.sec-btn-group { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }.sec-title-text {flex-grow: 1; font-size: 18px; font-weight: 800;background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;text-align: right; word-break: keep-all;}.pill-badge {padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;border: none; cursor: pointer; display: flex; align-items: center; gap: 4px;}.pill-badge.info {background: var(--strong-badge-bg); color: var(--strong-badge-text);font-weight: 900; transform: scale(1.05); cursor: default; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}.pill-badge.eye-btn { background: var(--primary-
