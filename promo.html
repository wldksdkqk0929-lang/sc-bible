<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인맞음 암기 시스템 (Auto-Promo Fix)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>

    <style>
        /* === V24.0 Core Design === */
        :root {
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --glass-card-bg: rgba(255, 255, 255, 0.9); 
            --glass-header: rgba(255, 255, 255, 0.85);
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-main: #2d3436; --text-sub: #636e72; --text-num: #764ba2;
            --btn-base: rgba(255,255,255,0.6);
            --mic-red: #ff4757;
        }
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #1a1e26 0%, #2d3436 100%);
            --glass-card-bg: rgba(30, 34, 40, 0.95); --glass-header: rgba(26, 30, 38, 0.95);
            --primary-gradient: linear-gradient(135deg, #C2935A 0%, #A67C49 100%);
            --text-main: #dfe6e9; --text-sub: #b2bec3; --text-num: #C2935A;
            --btn-base: rgba(255, 255, 255, 0.1);
        }
        body { margin: 0; background-image: var(--bg-gradient); font-family: 'Pretendard', sans-serif; padding-bottom: 150px; transition: 0.3s; }
        
        /* Header */
        header { position: sticky; top: 0; z-index: 1000; background: var(--glass-header); backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .deck-options { display: flex; justify-content: space-between; align-items: center; padding: 0 15px; height: 50px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .brand-logo { font-size: 20px; font-weight: 900; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        .opt-group { display: flex; gap: 8px; }
        .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.1); background: var(--btn-base); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
        .icon-btn.active { background: var(--primary-gradient); color: white; border: none; }

        .deck-chapters { display: flex; gap: 6px; padding: 10px 15px; overflow-x: auto; scrollbar-width: none; }
        .ch-btn { min-width: 40px; height: 32px; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; background: transparent; font-weight: 800; color: var(--text-sub); cursor: pointer; }
        .ch-btn.active { background: var(--primary-gradient); color: white; border: none; transform: scale(1.05); }

        .deck-subs { display: flex; gap: 8px; padding: 0 15px 10px 15px; overflow-x: auto; scrollbar-width: none; }
        .sub-btn { background: var(--btn-base); border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-sub); white-space: nowrap; cursor: pointer;}
        .sub-btn.active-sub { background: var(--text-main); color: white; opacity: 0.9; }

        /* Main Content */
        main { padding: 15px; max-width: 800px; margin: 0 auto; min-height: 150vh; /* 강제 높이 (스크롤용) */ }
        .section-group { background: var(--glass-card-bg); border-radius: 20px; padding: 5px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .sec-header { padding: 15px; font-weight: 800; font-size: 16px; color: var(--primary-gradient); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .verse-card { padding: 20px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; gap: 15px; font-size: 17px; line-height: 1.6; cursor: pointer; }
        .v-num { font-weight: 900; color: var(--text-num); min-width: 25px; text-align: right; }
        .verse-text { position: relative; color: var(--text-main); }
        .hidden .verse-text { color: transparent; }
        .hidden .verse-text::before { content: '👆 터치하여 확인'; position: absolute; top:0; left:0; color: #999; font-size: 14px; }
        
        /* Highlighting & Test */
        .user-mark { color: #ff4757; text-decoration: underline; background: rgba(255,71,87,0.1); font-weight: 900; }
        .test-input { width: 100%; height: 120px; padding: 15px; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; margin-top: 10px; box-sizing: border-box; resize: none;}
        .test-btns { display: flex; gap: 10px; margin-top: 10px; }
        .t-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 800; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;}
        .mic-btn { background: #b2bec3; }
        .mic-btn.rec { background: var(--mic-red); animation: pulse 1s infinite; }
        .check-btn { background: var(--primary-gradient); }
        .grade-res { background: white; padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid #eee; display: none; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,71,87,0.7); } 70% { box-shadow: 0 0 0 15px rgba(255,71,87,0); } }

        /* Login & Gate */
        #security-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .gate-card { background: rgba(255,255,255,0.95); padding: 40px; border-radius: 24px; text-align: center; width: 80%; max-width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .gate-input { font-size: 24px; padding: 15px; text-align: center; border-radius: 12px; border: 2px solid #eee; width: 100%; margin: 20px 0; outline: none; box-sizing: border-box;}
        .gate-btn { width: 100%; padding: 15px; background: var(--primary-gradient); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 800; cursor: pointer; }

        /* Ghost Cursor */
        #ghost { position: fixed; top: 50%; left: 50%; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 2px solid white; z-index: 999999; pointer-events: none; transition: transform 0.1s; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #ghost::after { content: ''; display: block; width: 100%; height: 100%; border-radius: 50%; background: rgba(255,71,87,0.5); transform: scale(0); transition: 0.2s; }
        #ghost.click { transform: scale(0.9); background: rgba(255,255,255,0.8); }
        #ghost.click::after { transform: scale(1.4); opacity: 0; }
        #ghost.drag { width: 30px; height: 30px; background: rgba(253, 203, 110, 0.8); border-color: #ffeaa7; }
    </style>
</head>
<body class="mode-memorize">

    <div id="ghost"></div>

    <header>
        <div class="deck-options">
            <div class="brand-logo">인맞음</div>
            <div class="opt-group">
                <button class="icon-btn" id="btn-manual">📖</button>
                <button class="icon-btn" id="btn-edit" onclick="toggleEdit()">✏️</button>
                <button class="icon-btn" id="btn-search" onclick="alert('검색')">🔍</button>
                <button class="icon-btn" id="btn-theme" onclick="toggleTheme()">🌙</button>
                <button class="icon-btn" id="btn-test" onclick="toggleTest()">📝</button>
            </div>
        </div>
        <div class="deck-chapters" id="chNav"></div>
        <div class="deck-subs" id="subNav"></div>
    </header>

    <main id="content"></main>

    <div id="security-gate">
        <div class="gate-card">
            <h2 style="margin:0 0 10px 0; color:#6c5ce7">인맞음 암기</h2>
            <p style="color:#888">보안 코드 입력</p>
            <input type="tel" id="gate-code" class="gate-input" placeholder="CODE">
            <button class="gate-btn" id="gate-btn" onclick="unlock()">입장하기</button>
        </div>
    </div>

    <script>
        // --- System Logic ---
        let isMarking = false;
        let isTest = false;

        function buildUI() {
            // Build Nav
            const nav = document.getElementById('chNav');
            for(let i=1; i<=10; i++) {
                nav.innerHTML += `<button class="ch-btn ${i===1?'active':''}" id="ch-${i}" onclick="loadChapter(${i})">${i}</button>`;
            }
            loadChapter(1);
        }

        function loadChapter(ch) {
            document.querySelectorAll('.ch-btn').forEach((b,i)=>b.classList.toggle('active', i+1===ch));
            const main = document.getElementById('content');
            const subNav = document.getElementById('subNav');
            main.innerHTML = ''; subNav.innerHTML = '';

            // [Dummy Data for Video]
            const sections = [
                {t: "계시록 전장의 요약", r:"1~3"},
                {t: "하나님 나라와 제사장", r:"4~6"},
                {t: "구름타고 오시는 예수님", r:"7~8"},
                {t: "성령의 감동", r:"9~11"}
            ];
            
            sections.forEach((s, idx) => {
                subNav.innerHTML += `<button class="sub-btn" id="sub-${idx}">${s.t}</button>`;
                let verses = '';
                for(let k=1; k<=3; k++) {
                    verses += `
                    <div class="verse-card hidden" id="v-${ch}-${idx}-${k}" onclick="if(!isMarking && !isTest) this.classList.toggle('hidden')">
                        <div class="v-num">${(idx*3)+k}</div>
                        <div class="verse-text">예수 그리스도의 계시라 이는 하나님이 그에게 주사 반드시 속히 될 일을...</div>
                    </div>`;
                }
                main.innerHTML += `
                <div class="section-group">
                    <div class="sec-header"><span>${s.r}</span><span>${s.t}</span></div>
                    ${verses}
                </div>`;
            });
        }

        function toggleEdit() {
            isMarking = !isMarking;
            document.getElementById('btn-edit').classList.toggle('active');
            document.querySelectorAll('.verse-card').forEach(c => {
                c.classList.remove('hidden');
                c.style.border = isMarking ? '2px solid #6c5ce7' : 'none';
            });
        }

        function toggleTest() {
            isTest = !isTest;
            document.getElementById('btn-test').classList.toggle('active');
            const card = document.querySelector('.verse-card'); // First card only for demo
            if(isTest) {
                card.classList.remove('hidden');
                card.innerHTML = `
                    <div class="v-num">1</div>
                    <div style="width:100%">
                        <textarea class="test-input" id="t-inp" placeholder="입력하세요..."></textarea>
                        <div class="test-btns">
                            <button class="t-btn mic-btn" id="btn-mic">🎙️ 음성</button>
                            <button class="t-btn check-btn" id="btn-check">💯 채점</button>
                        </div>
                        <div class="grade-res" id="grade-box"></div>
                    </div>
                `;
            } else {
                loadChapter(1); // Reset
            }
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme')==='dark'?'light':'dark');
        }

        function unlock() {
            const code = document.getElementById('gate-code').value;
            if(code === '1440') {
                document.getElementById('security-gate').style.opacity = 0;
                setTimeout(() => document.getElementById('security-gate').style.display='none', 500);
            }
        }

        // [Conflict Fix] Initialize using addEventListener
        window.addEventListener('load', () => {
            buildUI(); // Build interface normally
            
            // Check Auto Start
            if(sessionStorage.getItem('autoPromo') === 'true') {
                sessionStorage.removeItem('autoPromo');
                setTimeout(startGhost, 1000); // Wait 1s then start acting
            }
        });

        // === [Ghost Pilot] ===
        const ghost = document.getElementById('ghost');
        const wait = ms => new Promise(r => setTimeout(r, ms));

        async function move(sel, dur=800) {
            ghost.style.display = 'flex';
            const el = document.querySelector(sel);
            if(!el) return;
            const r = el.getBoundingClientRect();
            ghost.style.transition = `top ${dur}ms cubic-bezier(0.25,1,0.5,1), left ${dur}ms cubic-bezier(0.25,1,0.5,1)`;
            ghost.style.left = (r.left + r.width/2) + 'px';
            ghost.style.top = (r.top + r.height/2) + 'px';
            await wait(dur);
        }
        async function click(sel) {
            ghost.classList.add('click'); await wait(150);
            if(sel) document.querySelector(sel).click();
            ghost.classList.remove('click'); await wait(500);
        }
        async function type(sel, txt) {
            const el = document.querySelector(sel);
            el.value = "";
            for(let c of txt) { el.value += c; await wait(100); }
            await wait(500);
        }

        async function startGhost() {
            // #1. Login
            await move('#gate-code'); await type('#gate-code', '1440');
            await move('#gate-btn'); await click('#gate-btn');
            await wait(1500);

            // #2. Nav
            await move('#ch-2'); await click('#ch-2');
            await wait(1000);
            window.scrollBy({top: 200, behavior:'smooth'});
            await wait(1000);

            // #3. Reveal
            const v1 = '#v-2-0-1'; // Chapter 2, Section 0, Verse 1
            await move(v1); await click(v1);
            await wait(1000);

            // #4. Theme
            await move('#btn-theme'); await click('#btn-theme');
            await wait(1500); await click('#btn-theme');
            await wait(1000);

            // #5. Marking
            await move('#btn-edit'); await click('#btn-edit');
            await wait(500);
            // Drag simulation (Visual)
            ghost.classList.add('drag');
            const card = document.querySelector(v1);
            const cr = card.getBoundingClientRect();
            ghost.style.transition = 'left 1s linear';
            ghost.style.left = (cr.left + 200) + 'px';
            
            // Text color change to simulate highlight
            card.querySelector('.verse-text').innerHTML = `예수 <span class="user-mark">그리스도의 계시</span>라...`;
            
            await wait(1500);
            ghost.classList.remove('drag');
            await move('#btn-edit'); await click('#btn-edit');

            // #6. Test
            await move('#btn-test'); await click('#btn-test');
            await wait(1000);
            await move('#btn-mic'); await click('#btn-mic');
            document.getElementById('btn-mic').classList.add('rec');
            document.getElementById('btn-mic').innerText = "🛑";
            
            await type('#t-inp', '예수 그리스도의 계시라...');
            
            await click('#btn-mic');
            document.getElementById('btn-mic').classList.remove('rec');
            document.getElementById('btn-mic').innerText = "🎙️ 음성";
            
            await move('#btn-check'); await click('#btn-check');
            document.getElementById('grade-box').style.display='block';
            document.getElementById('grade-box').innerHTML = `<span style="background:#00b894;color:white;padding:5px 10px;border-radius:15px;font-weight:900;">98점</span>`;
            await wait(2000);

            // Finish
            ghost.style.opacity = 0;
            alert("🎬 촬영 끝!");
        }

        // Trigger
        let cnt = 0;
        document.querySelector('.brand-logo').addEventListener('click', () => {
            cnt++;
            if(cnt===3) {
                if(confirm("자동 촬영 모드 시작?")) {
                    sessionStorage.setItem('autoPromo', 'true');
                    location.reload();
                }
                cnt=0;
            }
        });
    </script>
</body>
</html>
